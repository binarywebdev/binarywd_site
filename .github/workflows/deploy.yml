name: Deploy BinaryWD WordPress theme

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: binarywd-production-theme
  cancel-in-progress: false

jobs:
  deploy-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Update production theme
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            repo=/var/www/binarywd.com/wp-content/themes/studio-dark
            backup_root=/var/backups/binarywd-theme
            release_id=$(date -u +%Y%m%dT%H%M%SZ)

            test -d "$repo/.git"
            test -z "$(git -c safe.directory="$repo" -C "$repo" status --porcelain)"
            mkdir -p "$backup_root"
            cp -a "$repo" "$backup_root/studio-dark-$release_id"

            git -c safe.directory="$repo" -C "$repo" fetch origin master
            git -c safe.directory="$repo" -C "$repo" checkout master
            git -c safe.directory="$repo" -C "$repo" pull --ff-only origin master

            chown -R www-data:www-data "$repo"
            find "$repo" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
            curl -fsS -H 'Host: binarywd.com' http://127.0.0.1/ >/dev/null
            git -c safe.directory="$repo" -C "$repo" rev-parse HEAD
